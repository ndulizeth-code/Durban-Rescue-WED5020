<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Durban Rescue | Location Map Durban KZN</title>
<meta name="description" content="Contact Durban Rescue in Durban. Find us on interactive Leaflet map. Email, phone, volunteer.">
<link rel="stylesheet" href="CSS/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<header>
<h1>Contact Durban Rescue</h1>
<nav>
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="adopt.html">Adopt</a>
<a href="enquiry.html">Enquiry</a>
<a href="contact.html">Contact</a>
</nav>
</header>
<main>
<h2>Find Us in Durban - Interactive Map (Leaflet)</h2>
<div id="map"></div>

<h3>General Contact Form - Send Email</h3>
<form id="contactForm" action="https://formspree.io/f/xzzbrqkw" method="POST" onsubmit="return validateForm(event)">
<label>Full Name *</label>
<input type="text" id="name" name="name" required minlength="3">

<label>Email *</label>
<input type="email" id="email" name="email" required>

<label>Message Type *</label>
<select name="messageType" required>
<option value="">Select</option>
<option value="General">General</option>
<option value="Adoption">Adoption</option>
<option value="Complaint">Complaint</option>
</select>

<label>Your Message *</label>
<textarea id="message" name="message" required minlength="10"></textarea>

<p id="formError" class="error"></p>
<button type="submit">Send Email</button>
</form>

<p>Follow us: Facebook | Instagram - Local SEO: Durban Rescue, Durban KZN</p>
</main>
<footer>
<p>&copy; 2026 Durban Rescue</p>
</footer>
<script src="JS/script.js"></script>
<script>
var map = L.map('map').setView([-29.8587,31.0218],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map);
L.marker([-29.8587,31.0218]).addTo(map).bindPopup('Durban Rescue - Dog & Cat Shelter Durban').openPopup();
</script>
</body>
</html>
